      responses:
        "200":
          description: Alert list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"

  # NOTIFIKASI
  /notifikasi:
    get:
      operationId: listNotifikasi
      tags: [notifikasi]
      summary: List notifikasi user
      responses:
        "200":
          description: List notifikasi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notifikasi"

  /notifikasi/{id}/baca:
    patch:
      operationId: bacaNotifikasi
      tags: [notifikasi]
      summary: Tandai notifikasi sudah dibaca
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notifikasi"

